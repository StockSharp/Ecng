name: Ecng Native AOT audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'common.props'
      - 'Common/**'
      - 'Serialization/**'
      - 'Tests/Common/AotCompatibilityTests.cs'
      - 'AotSmoke/**'
      - '.github/workflows/aot-audit.yml'

jobs:
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Compile legacy net6 target
        run: dotnet build Serialization/Serialization.csproj -c Release -f net6.0

      - name: Analyze Ecng.Common
        shell: bash
        run: |
          set -o pipefail
          dotnet build Common/Common.csproj -c Release -f net10.0 \
            -p:EcngAotAudit=true -p:TrimmerSingleWarn=false \
            -bl:common-aot.binlog 2>&1 | tee common-aot.log

      - name: Analyze Ecng.Serialization
        shell: bash
        run: |
          set -o pipefail
          dotnet build Serialization/Serialization.csproj -c Release -f net10.0 \
            -p:EcngAotAudit=true -p:TrimmerSingleWarn=false \
            -bl:serialization-aot.binlog 2>&1 | tee serialization-aot.log

      - name: Run compatibility tests
        run: >
          dotnet test Tests/Tests.csproj -c Release -f net10.0
          --filter 'FullyQualifiedName~AotCompatibilityTests'
          --settings Tests/test.runsettings

      - name: Publish native smoke app
        shell: bash
        run: |
          set -o pipefail
          dotnet publish AotSmoke/AotSmoke.csproj -f net10.0 -c Release -r linux-x64 \
            -p:EcngAotAudit=true -p:TrimmerSingleWarn=false \
            -bl:publish-aot.binlog -o artifacts/ecng-aot 2>&1 | tee publish-aot.log

      - name: Execute native smoke app
        run: ./artifacts/ecng-aot/Ecng.AotSmoke

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecng-aot-diagnostics
          path: |
            common-aot.log
            common-aot.binlog
            serialization-aot.log
            serialization-aot.binlog
            publish-aot.log
            publish-aot.binlog
          if-no-files-found: warn
          retention-days: 14
