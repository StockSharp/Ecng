name: Drawing coverage

on:
  pull_request:
    paths:
      - 'Drawing/**'
      - 'Tests/Drawing/**'
      - 'Tests/Tests.csproj'
      - '.github/workflows/drawing-coverage.yml'
  workflow_dispatch:

jobs:
  drawing-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Tests/Tests.csproj
      - name: Build
        run: dotnet build Tests/Tests.csproj -f net10.0 -c Release --no-restore
      - name: Run every Drawing test and collect line and branch coverage
        run: >-
          dotnet test Tests/Tests.csproj -f net10.0 -c Release
          --no-build --no-restore
          --filter "FullyQualifiedName~Ecng.Tests.Drawing"
          --collect:"XPlat Code Coverage"
          --settings Tests/drawing.coverage.runsettings
          --results-directory coverage-out
      - name: Coverage summary
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('coverage-out/**/coverage.cobertura.xml', recursive=True)
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one coverage XML report; got {files}')
          root = ET.parse(files[0]).getroot()
          print('Ecng.Drawing:')
          print(f'  lines:    {100 * float(root.attrib.get("line-rate", 0)):.1f}%')
          print(f'  branches: {100 * float(root.attrib.get("branch-rate", 0)):.1f}%')
          for entry in root.findall('.//class'):
              path = entry.get('filename', '')
              rate = 100 * float(entry.get('line-rate', 0))
              branch = 100 * float(entry.get('branch-rate', 0))
              print(f'  {path}: lines {rate:.1f}%, branches {branch:.1f}%')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawing-cobertura-report
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: warn
